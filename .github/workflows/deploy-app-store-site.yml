name: Deploy App Store Site

on:
  push:
    branches: [main]
    paths:
      - "app-store-release-prep/web/**"
      - "scripts/publish-app-store-pages.sh"
      - ".github/workflows/deploy-app-store-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: standing-desk-site-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::397565768461:role/github-standingdesk-site-deploy
          aws-region: eu-west-1

      - name: Publish website
        env:
          CLOUDFRONT_DISTRIBUTION_ID: E3C0WPKC4RFR6O
        run: scripts/publish-app-store-pages.sh
