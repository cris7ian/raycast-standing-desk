name: Deploy App Store Site

on:
  push:
    branches: [main]
    paths:
      - "app-store-release-prep/web/**"
      - "scripts/publish-app-store-pages.sh"
      - ".github/workflows/deploy-app-store-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: standing-desk-site-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::397565768461:role/github-standingdesk-site-deploy
          aws-region: eu-west-1

      - name: Publish website
        env:
          CLOUDFRONT_DISTRIBUTION_ID: E3C0WPKC4RFR6O
        run: scripts/publish-app-store-pages.sh
